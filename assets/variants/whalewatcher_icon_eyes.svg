<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>whalewatcher (eyes variant)</title>
  <desc>Orca in a circular badge, watched by a pair of eyes. Same body as the
        binoculars variant; the eyes are offset to the upper left because a
        symmetric pair inside a circle reads as a face rather than a watcher.</desc>

  <defs>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>

    <path id="orcaBody" d="
      M 104 300
      C 106 276, 134 254, 184 246
      C 218 241, 240 242, 258 245
      C 266 222, 277 201, 290 178
      C 298 202, 307 230, 316 250
      C 348 255, 378 264, 402 276
      C 428 266, 458 258, 488 255
      C 484 272, 471 281, 453 287
      C 471 293, 486 303, 492 318
      C 468 316, 437 304, 409 291
      C 366 310, 322 322, 272 324
      C 206 326, 134 318, 104 300
      Z"/>

    <clipPath id="bodyClip">
      <use href="#orcaBody"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="236" fill="#8ED8EC"/>

  <g clip-path="url(#badgeClip)">

    <!-- ============ watcher: a pair of eyes ============
         Deliberately off-centre and slightly rotated. Centred symmetrically
         they combined with the badge circle into an unmistakable smiley face,
         with the orca reading as a mouth. Pupils track down-right, onto the whale. -->
    <g transform="rotate(-7 180 120)">
      <ellipse cx="140" cy="124" rx="40" ry="29" fill="#1B3348"/>
      <ellipse cx="140" cy="124" rx="32" ry="21" fill="#F4FBFD"/>
      <circle cx="151" cy="131" r="13" fill="#12202F"/>

      <ellipse cx="222" cy="116" rx="40" ry="29" fill="#1B3348"/>
      <ellipse cx="222" cy="116" rx="32" ry="21" fill="#F4FBFD"/>
      <circle cx="233" cy="123" r="13" fill="#12202F"/>
    </g>

    <!-- water: sine profile, nods at the vibrational-mode tab -->
    <path d="M -10 404
             C 55 378, 120 378, 185 404
             C 250 430, 315 430, 380 404
             C 445 378, 500 378, 522 394
             L 522 522 L -10 522 Z"
          fill="#3FA8CC"/>
    <path d="M -10 434
             C 55 408, 120 408, 185 434
             C 250 460, 315 460, 380 434
             C 445 408, 500 408, 522 424
             L 522 522 L -10 522 Z"
          fill="#2A8CB0"/>
  </g>

  <use href="#orcaBody" fill="#101A28"/>

  <g clip-path="url(#bodyClip)">
    <ellipse cx="244" cy="408" rx="214" ry="104" fill="#FFFFFF"/>
    <ellipse cx="168" cy="280" rx="26" ry="15"
             transform="rotate(-20 168 280)" fill="#FFFFFF"/>
  </g>

  <circle cx="256" cy="256" r="236" fill="none" stroke="#14556B" stroke-opacity="0.35" stroke-width="8"/>
</svg>
